    uint32 achieved_time = 2;
    uint32 achieved_counter = 3;
  }

  uint32 account_id = 1;
  string nickname = 2;
  uint32 login_time = 3;
  uint32 logout_time = 4;
  uint32 room_id = 5;
  .lq.AntiAddiction anti_addiction = 6;

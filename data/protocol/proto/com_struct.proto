message ViewSlot {
  uint32 slot = 1;
  uint32 item_id = 2;
  uint32 type = 3;
  repeated uint32 item_id_list = 4;
}

message VillageBuildingData {
  uint32 id = 1;
  repeated .lq.VillageReward reward = 3;
  repeated uint32 workers = 4;
}

message VillageReward {
  uint32 id = 1;
  uint32 count = 2;
}

message VillageTargetInfo {
  string nickname = 1;
  uint32 avatar = 2;
  uint32 avatar_frame = 3;
  uint32 title = 4;
  uint32 verified = 5;
}

message VillageTaskData {
  uint32 id = 1;
  uint32 completed_count = 2;
}

message VillageTripData {
  uint32 start_round = 1;
  uint32 dest_id = 2;
  repeated .lq.VillageReward reward = 3;
  uint32 level = 4;
  .lq.VillageTargetInfo info = 5;
}

message VoteData {
  uint32 activity_id = 1;
  uint32 vote = 2;
  uint32 count = 3;
}

message Wrapper {
  string name = 1;
  bytes data = 2;
}

message ZHPShop {

  message RefreshCount {
    uint32 count = 1;
    uint32 limit = 2;
  }

  repeated uint32 goods = 1;
  repeated .lq.BuyRecord buy_records = 2;
  .lq.ZHPShop.RefreshCount free_refresh = 3;
  .lq.ZHPShop.RefreshCount cost_refresh = 4;
}

  string email = 9;
  uint32 email_verify = 10;
  uint32 gold = 11;
  uint32 diamond = 12;
  uint32 avatar_id = 13;
  uint32 vip = 14;
  int32 birthday = 15;
  string phone = 16;
  uint32 phone_verify = 17;
  repeated .lq.Account.PlatformDiamond platform_diamond = 18;
  .lq.AccountLevel level = 21;
  .lq.AccountLevel level3 = 22;
  uint32 avatar_frame = 23;
  uint32 skin_ticket = 24;

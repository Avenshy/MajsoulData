  repeated string doras = 7;
  .lq.MuyuInfo muyu = 8;
  int32 baopai = 9;
  .lq.HunZhiYiJiBuffInfo hun_zhi_yi_ji_info = 10;
}

message ActionHuleXueZhanEnd {
  repeated .lq.HuInfoXueZhanMid hules = 1;
  repeated int32 old_scores = 2;
  repeated int32 delta_scores = 3;
  repeated int32 scores = 4;
  uint32 wait_timeout = 5;
  .lq.GameEnd gameend = 6;
  repeated string doras = 7;
  .lq.MuyuInfo muyu = 8;
  repeated .lq.HuleInfo hules_history = 9;
}

message ActionHuleXueZhanMid {
  repeated .lq.HuInfoXueZhanMid hules = 1;
  repeated int32 old_scores = 2;
  repeated int32 delta_scores = 3;
  repeated int32 scores = 5;
  repeated string doras = 7;
  .lq.MuyuInfo muyu = 8;
  .lq.LiQiSuccess liqi = 9;
  bool zhenting = 10;
}

message ActionLiuJu {
  uint32 type = 1;
  .lq.GameEnd gameend = 2;
  uint32 seat = 3;
  repeated string tiles = 4;
  .lq.LiQiSuccess liqi = 5;
  repeated string allplayertiles = 6;
  .lq.MuyuInfo muyu = 7;

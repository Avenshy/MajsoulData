syntax = "proto3";

package lq;

message ActionAnGangAddGang {
  uint32 seat = 1;
  uint32 type = 2;
  string tiles = 3;
  .lq.OptionalOperationList operation = 4;
  repeated string doras = 6;
  bool zhenting = 7;
  repeated .lq.TingPaiInfo tingpais = 8;
  .lq.MuyuInfo muyu = 9;
}

message ActionBaBei {
  uint32 seat = 1;
  .lq.OptionalOperationList operation = 4;
  repeated string doras = 6;
  bool zhenting = 7;
  repeated .lq.TingPaiInfo tingpais = 8;
  bool moqie = 9;
  uint32 tile_state = 10;
  .lq.MuyuInfo muyu = 11;
}

message ActionChangeTile {
  repeated string in_tiles = 1;
  repeated int32 in_tile_states = 2;
  repeated string out_tiles = 3;
  repeated int32 out_tile_states = 4;
  repeated string doras = 5;
  repeated .lq.TingPaiDiscardInfo tingpais0 = 6;
  repeated .lq.TingPaiInfo tingpais1 = 7;
  .lq.OptionalOperationList operation = 8;
  uint32 change_type = 9;
}

message ActionChiPengGang {
  uint32 seat = 1;
  uint32 type = 2;
  repeated string tiles = 3;
  repeated uint32 froms = 4;
  .lq.LiQiSuccess liqi = 5;
  .lq.OptionalOperationList operation = 6;
  bool zhenting = 7;
  repeated .lq.TingPaiDiscardInfo tingpais = 8;
  repeated uint32 tile_states = 9;
  .lq.MuyuInfo muyu = 10;
  repeated int32 scores = 11;
  uint32 liqibang = 12;
  .lq.YongchangInfo yongchang = 13;
  .lq.HunZhiYiJiBuffInfo hun_zhi_yi_ji_info = 14;
}

message ActionDealTile {
  uint32 seat = 1;
  string tile = 2;
  uint32 left_tile_count = 3;
  .lq.OptionalOperationList operation = 4;
  .lq.LiQiSuccess liqi = 5;
  repeated string doras = 6;
  bool zhenting = 7;
  repeated .lq.TingPaiDiscardInfo tingpais = 8;
  uint32 tile_state = 9;
  .lq.MuyuInfo muyu = 10;
  uint32 tile_index = 11;
  .lq.HunZhiYiJiBuffInfo hun_zhi_yi_ji_info = 12;
}

message ActionDiscardTile {
  uint32 seat = 1;
  string tile = 2;
  bool is_liqi = 3;
  .lq.OptionalOperationList operation = 4;
  bool moqie = 5;
  bool zhenting = 6;
  repeated .lq.TingPaiInfo tingpais = 7;
  repeated string doras = 8;
  bool is_wliqi = 9;
  uint32 tile_state = 10;
  .lq.MuyuInfo muyu = 11;
  bool revealed = 12;
  repeated int32 scores = 13;
  uint32 liqibang = 14;
  .lq.YongchangInfo yongchang = 25;
  .lq.HunZhiYiJiBuffInfo hun_zhi_yi_ji_info = 26;
  uint32 liqi_type_beishuizhizhan = 27;
}

message ActionFillAwaitingTiles {
  repeated string awaiting_tiles = 1;
  uint32 left_tile_count = 2;
  .lq.OptionalOperationList operation = 3;
  .lq.LiQiSuccess liqi = 4;
}

message ActionGangResult {
  .lq.ChuanmaGang gang_infos = 1;
}

message ActionGangResultEnd {

}

message GameAction {
  uint32 passed = 1;
  uint32 type = 2;
  bytes result = 3;
  .lq.GameUserInput user_input = 4;
  .lq.GameUserEvent user_event = 5;
  uint32 game_event = 6;
}

message GameChiPengGang {
  uint32 type = 1;
  uint32 index = 2;
  bool cancel_operation = 3;
  uint32 timeuse = 6;
}

message GameDetailRecords {
  repeated bytes records = 1;
  uint32 version = 2;
  repeated .lq.GameAction actions = 3;
  bytes bar = 4;
}

message GameEnd {
  repeated int32 scores = 1;
}

message GameSelfOperation {
  uint32 type = 1;
  uint32 index = 2;
  string tile = 3;
  bool cancel_operation = 4;
  bool moqie = 5;
  uint32 timeuse = 6;
  int32 tile_state = 7;
  repeated string change_tiles = 8;
  repeated int32 tile_states = 9;
  uint32 gap_type = 10;
  bool auto_operation = 11;
}

message GameSnapshot {

  message PlayerSnapshot {

    message Fulu {
      uint32 type = 1;
      repeated string tile = 2;
      repeated uint32 from = 3;
    }

    int32 score = 1;
    int32 liqiposition = 2;
    uint32 tilenum = 3;
    repeated string qipais = 4;
    repeated .lq.GameSnapshot.PlayerSnapshot.Fulu mings = 5;
  }

  uint32 chang = 1;
  uint32 ju = 2;
  uint32 ben = 3;
  uint32 index_player = 4;
  uint32 left_tile_count = 5;
  repeated string hands = 6;
  repeated string doras = 7;
  uint32 liqibang = 8;
  repeated .lq.GameSnapshot.PlayerSnapshot players = 9;
  bool zhenting = 10;
}

message GameUserEvent {
  uint32 seat = 1;
  uint32 type = 2;
}

message GameUserInput {
  uint32 seat = 1;
  uint32 type = 2;
  uint32 emo = 3;
  uint32 emo_id = 4;
  .lq.GameSelfOperation operation = 10;
  .lq.GameChiPengGang cpg = 11;
  .lq.GameVoteGameEnd vote = 12;
}

message GameVoteGameEnd {
  bool yes = 1;
}

message HuInfoXueZhanMid {
